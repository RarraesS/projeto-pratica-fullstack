<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Mural de Recados</title>

    <link
            rel="shortcut icon"
            href="icone.png"
            type="image/x-icon"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: #f4f4f4;
            color: #222;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: #e30613;
            color: #fff;
            text-align: center;
            padding: 24px;
        }

        main {
            width: min(700px, 92%);
            margin: 28px auto;
        }

        form,
        article {
            background: #fff;
            padding: 10px;
            margin-bottom: 14px;
            border-radius: 8px;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 11px;
            margin: 8px 0 14px;
            font: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            background: #e30613;
            color: #fff;
            border: 0;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b9040e;
        }

        h2 {
            margin-top: 28px;
        }

        article {
            border-left: 5px solid #e30613;
        }

        article p {
            margin-bottom: 0;
        }

        #aviso {
            min-height: 22px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <h1>Mural de recados</h1>

    <p>
        Front + Java + JDBC + MySQL
    </p>

</header>

<main>

    <form id="form-recado">

        <label for="autor">
            Nome
        </label>

        <input
                type="text"
                id="autor"
                name="autor"
                maxlength="255"
                required
        >

        <label for="mensagem">
            Recado
        </label>

        <textarea
                id="mensagem"
                name="mensagem"
                maxlength="255"
                required
        ></textarea>

        <button type="submit">
            Publicar recado
        </button>

    </form>

    <p id="aviso"></p>

    <h2>
        Recados publicados
    </h2>

    <section id="lista-recados"></section>

</main>

<script>

    const formulario =
        document.querySelector("#form-recado");

    const lista =
        document.querySelector("#lista-recados");

    const aviso =
        document.querySelector("#aviso");


    async function carregarRecados() {

        try {

            const resposta =
                await fetch("/api/recados");


            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível carregar os recados."
                );
            }


            const recados =
                await resposta.json();


            lista.innerHTML = "";


            for (const recado of recados) {

                const cartao =
                    document.createElement("article");

                const autor =
                    document.createElement("strong");

                const mensagem =
                    document.createElement("p");


                autor.textContent =
                    recado.autor;

                mensagem.textContent =
                    recado.mensagem;


                cartao.append(
                    autor,
                    mensagem
                );


                lista.appendChild(cartao);
            }

        } catch (erro) {

            console.error(erro);

            aviso.textContent =
                "Não foi possível carregar os recados.";
        }
    }


    formulario.addEventListener(
        "submit",
        async function (evento) {

            evento.preventDefault();

            aviso.textContent =
                "Salvando...";


            try {

                const dados =
                    new URLSearchParams(
                        new FormData(formulario)
                    );


                const resposta =
                    await fetch(
                        "/api/recados",
                        {
                            method: "POST",
                            body: dados
                        }
                    );


                if (!resposta.ok) {

                    throw new Error(
                        "Falha ao cadastrar o recado."
                    );
                }


                formulario.reset();


                aviso.textContent =
                    "Recado cadastrado com sucesso!";


                await carregarRecados();

            } catch (erro) {

                console.error(erro);

                aviso.textContent =
                    "Não foi possível cadastrar o recado.";
            }
        }
    );


    carregarRecados();

</script>

</body>

</html>
